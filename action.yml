name: Anarkali Decision
description: Preview Anarkali decision action
inputs:
  model-dir:
    description: Released Anarkali model directory
    required: true
  request-file:
    description: JSON request file with state and questions
    required: false
  state-json:
    description: Inline JSON state
    required: false
  questions-json:
    description: Inline JSON questions object
    required: false
  python-version:
    description: Python version for setup-python
    required: false
    default: "3.11"
outputs:
  answers:
    description: Anarkali answer JSON
    value: ${{ steps.decide.outputs.answers }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: python -m pip install ".[onnx]"
    - id: decide
      shell: bash
      env:
        MODEL_DIR: ${{ inputs.model-dir }}
        REQUEST_FILE: ${{ inputs.request-file }}
        STATE_JSON: ${{ inputs.state-json }}
        QUESTIONS_JSON: ${{ inputs.questions-json }}
      run: |
        set -euo pipefail
        if [ -n "${REQUEST_FILE}" ]; then
          anarkali decide --model "${MODEL_DIR}" --request "${REQUEST_FILE}" > "${RUNNER_TEMP}/anarkali-answer.json"
        else
          python - <<'PY' > "${RUNNER_TEMP}/anarkali-request.json"
        import json
        import os

        state = json.loads(os.environ["STATE_JSON"])
        questions = json.loads(os.environ["QUESTIONS_JSON"])
        print(json.dumps({"state": state, "questions": questions}))
        PY
          anarkali decide --model "${MODEL_DIR}" --request "${RUNNER_TEMP}/anarkali-request.json" > "${RUNNER_TEMP}/anarkali-answer.json"
        fi
        {
          echo "answers<<ANARKALI_JSON"
          cat "${RUNNER_TEMP}/anarkali-answer.json"
          echo "ANARKALI_JSON"
        } >> "${GITHUB_OUTPUT}"
