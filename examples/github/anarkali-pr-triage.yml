name: Anarkali PR Triage Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY' > anarkali-pr-request.json
          import json
          import os
          import subprocess

          diff = subprocess.check_output(
              ["git", "diff", "--numstat", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]],
              text=True,
          )
          files = []
          for line in diff.splitlines():
              additions, deletions, path = line.split("\t", 2)
              files.append({
                  "path": path,
                  "additions": None if additions == "-" else int(additions),
                  "deletions": None if deletions == "-" else int(deletions),
              })
          state = {
              "title": os.environ["PR_TITLE"],
              "body": os.environ.get("PR_BODY") or "",
              "changed_files": files,
              "tests_touched": any(f["path"].startswith("tests/") or "/test" in f["path"] for f in files),
              "security_paths_touched": any(
                  any(part in f["path"].lower() for part in ("security", "auth", "crypto", "permission"))
                  for f in files
              ),
          }
          questions = {
              "review_decision": {
                  "type": "choice",
                  "instructions": "Choose the pull request review decision.",
                  "criteria": {
                      "approve": "The pull request can be approved.",
                      "request_changes": "The pull request needs author changes before merge.",
                      "needs_senior_review": "A senior engineer should review before merge.",
                      "split_pr": "The pull request should be split into smaller changes.",
                  },
              },
              "category": {
                  "type": "choice",
                  "instructions": "Choose the primary pull request category.",
                  "criteria": {
                      "feature": "New behavior or product capability.",
                      "bugfix": "Fixes incorrect behavior.",
                      "refactor": "Internal restructuring without intended behavior change.",
                      "docs": "Documentation-only change.",
                      "dependency": "Dependency or build tooling change.",
                      "test": "Test-only change.",
                  },
              },
              "needs_security_review": {
                  "type": "noul",
                  "instructions": "This pull request needs a security review.",
              },
              "risk": {
                  "type": "score",
                  "instructions": "Estimate the pull request risk.",
                  "criteria": ["trivial", "low", "moderate", "high"],
              },
          }
          print(json.dumps({"state": state, "questions": questions}, indent=2))
          PY
      - id: anarkali
        uses: ./
        with:
          model-dir: artifacts/release/anarkali-lite-v4
          request-file: anarkali-pr-request.json
      - name: Summary
        run: |
          {
            echo "## Anarkali PR triage preview"
            echo
            echo "Preview only: the coding model is not trained yet."
            echo
            echo '```json'
            printf '%s\n' '${{ steps.anarkali.outputs.answers }}'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
